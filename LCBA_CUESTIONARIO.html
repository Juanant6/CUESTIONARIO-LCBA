/* ---------- Utilidades ---------- */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function tableHtml(title,rows){var h="<p><b>"+title+"</b></p><table>";rows.forEach(function(r){h+="<tr><td>"+r[0]+"</td><td>"+r[1]+"</td></tr>";});return h+"</table>";}
document.getElementById("fichasBody").innerHTML=
  tableHtml("Temas (pregunta 2)",T)+tableHtml("Función de los personajes (pregunta 3)",F)+tableHtml("Recursos (pregunta 5)",R)+
  "<p><b>Ficha de estructura (pregunta 4)</b></p><table><tr><td>Acto</td><td>I (planteamiento) · II (nudo) · III (desenlace)</td></tr><tr><td>Tiempo</td><td>Mañana, habitación blanquísima · Tarde, habitación interior blanca · Noche, patio interior de paredes blancas</td></tr><tr><td>Fase</td><td>Calma inicial · Sucesión de conflictos · Violencia final</td></tr><tr><td>Circular</td><td>«¡Silencio!» primera y última palabra · campanas · muerte del padre / de la hija · calor · blanco y negro</td></tr></table>";

/* ---------- Estado ---------- */
var state={}; /* id -> {checked:bool, score, max} por ejercicio: state[setId+q] */
var current="p1";

function exKey(s,e){return s.id+"-"+e.q;}

function render(id){
  current=id;
  var s=SETS.filter(function(x){return x.id===id;})[0]||SETS[0];
  current=s.id;
  var h="<h2>"+s.title+(s.act!=="Bloque fijo"?" <span class='note'>· ejercicios de las preguntas 2 a 5</span>":"")+"</h2>";
  if(s.frag){h+="<div class='frag'>"+s.frag.map(function(l){return "<p>"+l+"</p>";}).join("")+"</div>";}
  s.ex.forEach(function(e,ei){
    h+="<section class='ex' data-ex='"+ei+"'><h3><em>"+e.q+"</em> · "+e.title+"</h3><p class='hint'>"+e.hint+"</p>";
    if(e.intro)h+="<p class='intro'>"+e.intro+"</p>";
    e.rows.forEach(function(r,ri){
      /* mezclar opciones solo en ejercicios de localizar y A1 */
      h+="<div class='row' data-r='"+ri+"'><div class='lab'>"+r.label+(r.note?"":"")+"</div><div class='ctl'>";
      r.ctrls.forEach(function(c,ci){
        var opts=c.shuf?c.shuf:c.opts;
        h+="<select data-c='"+ci+"' aria-label='Respuesta'><option value=''>"+esc(c.ph)+"</option>"+opts.map(function(o){return "<option value='"+esc(o[0])+"'>"+esc(o[1])+"</option>";}).join("")+"</select>";
      });
      h+="</div><div class='sol'></div></div>";
    });
    h+="<div class='bar'><button class='main' data-act='check'>Comprobar</button><button data-act='show'>Ver solución</button><button data-act='reset'>Borrar</button><span class='score'></span></div></section>";
  });
  var idx=SETS.indexOf(s);
  h+="<div class='pn'><button "+(idx===0?"disabled style='opacity:.4'":"data-go='"+SETS[idx-1].id+"'")+">← Anterior</button><button "+(idx===SETS.length-1?"disabled style='opacity:.4'":"data-go='"+SETS[idx+1].id+"'")+">Siguiente →</button></div>";
  var v=document.getElementById("view");v.innerHTML=h;
  /* restaurar estado de comprobaciones previas */
  s.ex.forEach(function(e,ei){var st=state[exKey(s,e)];if(st&&st.vals){var sec=v.querySelectorAll(".ex")[ei];var sels=sec.querySelectorAll("select");st.vals.forEach(function(val,i){if(sels[i])sels[i].value=val;});if(st.checked)check(s,ei,sec,true);}});
  navUpdate();
  try{history.replaceState(null,"","#"+s.id);}catch(_){try{location.hash=s.id;}catch(__){}}
  window.scrollTo(0,0);
}

function labelOf(c,val){for(var i=0;i<c.opts.length;i++)if(c.opts[i][0]===val)return c.opts[i][1];return val;}

function check(s,ei,sec,silent){
  var e=s.ex[ei];var rows=sec.querySelectorAll(".row");var ok=0;
  e.rows.forEach(function(r,ri){
    var row=rows[ri];var sels=row.querySelectorAll("select");var good=true;var sol=[];
    r.ctrls.forEach(function(c,ci){
      var v=sels[ci].value;
      if(c.ans.indexOf(v)===-1)good=false;
      sol.push(labelOf(c,c.ans[0]));
    });
    row.className="row "+(good?"ok":"bad");
    var note=r.note&&!good?" "+esc(r.note):"";
    row.querySelector(".sol").innerHTML=good?"":"Solución: "+esc(sol.join(" · "))+note;
    if(good)ok++;
  });
  var sc=sec.querySelector(".score");sc.textContent=ok+" / "+e.rows.length;sc.className="score"+(ok===e.rows.length?" full":"");
  saveVals(s,ei,sec,true,ok,e.rows.length);
}
function saveVals(s,ei,sec,checked,ok,max){
  var e=s.ex[ei];var vals=[].map.call(sec.querySelectorAll("select"),function(x){return x.value;});
  state[exKey(s,e)]={vals:vals,checked:checked,score:ok||0,max:max||e.rows.length};
  totals();navUpdate();
}
function totals(){
  var ok=0,max=0;
  SETS.forEach(function(s){s.ex.forEach(function(e){var st=state[exKey(s,e)];max+=e.rows.length;if(st&&st.checked)ok+=st.score;});});
  document.getElementById("total").textContent="Aciertos: "+ok+" / "+max;
}
function navUpdate(){
  [].forEach.call(document.querySelectorAll("#nav button"),function(b){
    var id=b.getAttribute("data-id");var s=SETS.filter(function(x){return x.id===id;})[0];
    b.className=(id===current?"on":"")+(complete(s)?" done":"");
  });
}
function complete(s){return s.ex.every(function(e){var st=state[exKey(s,e)];return st&&st.checked&&st.score===e.rows.length;});}

/* ---------- Eventos ---------- */
document.getElementById("view").addEventListener("click",function(ev){
  var t=ev.target;
  var go=t.getAttribute&&t.getAttribute("data-go");
  if(go){render(go);return;}
  var act=t.getAttribute&&t.getAttribute("data-act");if(!act)return;
  var sec=t.closest(".ex");var ei=+sec.getAttribute("data-ex");
  var s=SETS.filter(function(x){return x.id===current;})[0];var e=s.ex[ei];
  if(act==="check"){check(s,ei,sec);}
  if(act==="show"){
    var rows=sec.querySelectorAll(".row");
    e.rows.forEach(function(r,ri){var sels=rows[ri].querySelectorAll("select");r.ctrls.forEach(function(c,ci){sels[ci].value=c.ans[0];});});
    check(s,ei,sec);
  }
  if(act==="reset"){
    [].forEach.call(sec.querySelectorAll("select"),function(x){x.value="";});
    [].forEach.call(sec.querySelectorAll(".row"),function(r){r.className="row";r.querySelector(".sol").innerHTML="";});
    sec.querySelector(".score").textContent="";
    delete state[exKey(s,e)];totals();navUpdate();
  }
});
document.getElementById("view").addEventListener("change",function(ev){
  var sec=ev.target.closest&&ev.target.closest(".ex");if(!sec)return;
  var s=SETS.filter(function(x){return x.id===current;})[0];var ei=+sec.getAttribute("data-ex");
  var row=ev.target.closest(".row");row.className="row";row.querySelector(".sol").innerHTML="";
  var st=state[exKey(s,s.ex[ei])];
  saveVals(s,ei,sec,false);
  sec.querySelector(".score").textContent="";
});

/* ---------- Navegación ---------- */
(function buildNav(){
  var nav=document.getElementById("nav");var groups=[];
  SETS.forEach(function(s){var g=groups[groups.length-1];if(!g||g.name!==s.act){g={name:s.act,items:[]};groups.push(g);}g.items.push(s);});
  nav.innerHTML=groups.map(function(g){return "<div class='grp'><span>"+(g.name==="Bloque fijo"?"Fijo":g.name)+"</span>"+g.items.map(function(s){return "<button data-id='"+s.id+"'>"+s.nav+"</button>";}).join("")+"</div>";}).join("");
  nav.addEventListener("click",function(ev){var id=ev.target.getAttribute&&ev.target.getAttribute("data-id");if(id)render(id);});
})();
/* mezclar opciones de los ejercicios de localizar y de A1 una sola vez */
SETS.forEach(function(s){s.ex.forEach(function(e){if(e.q==="P5"&&e.rows[0].ctrls[0].opts.length>5&&e.title&&e.rows.every(function(r){return r.ctrls[0].opts===undefined||true;})){}});});
SETS.forEach(function(s){s.ex.forEach(function(e){var isLoc=(e.hint===LOC);if(isLoc||e.q==="A1"){e.rows.forEach(function(r){r.ctrls.forEach(function(c){c.shuf=shuffle(c.opts);});});}});});
window.addEventListener("hashchange",function(){var h=location.hash.replace("#","");if(h&&h!==current)render(h);});
render(location.hash.replace("#","")||"p1");
totals();
</script>
